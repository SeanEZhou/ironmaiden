# Design-rule assumptions (all must be bench-validated).
rules:
  servo_cont_frac: 0.35      # usable continuous torque as fraction of stall (thermal); ROBOTIS: stall is momentary
  servo_peak_frac: 0.70      # short (<2 s) peak torque fraction
  servo_speed_at_load: 0.6   # fraction of no-load speed available at continuous torque
  install_eff: 0.85          # installed/bench thrust (side intake, guard, gimbal gap); band 0.75-0.90
  install_eff_band: [0.75, 0.90]
  power_exponent: 1.5        # P ~ T^1.5 fitted to JP70 data (1.54)
  cell_v_loaded: 3.7         # V/cell under hover load mid-pack (reference for test-point use)
  cell_v_end: 3.5            # V/cell end of usable capacity
  usable_frac: 0.75          # usable pack energy (reserve 20% + sag)
  aux_power_w: 60            # servos holding + FC + BEC losses in hover
  shell_wall_mm: 1.2
  shell_density_gcc: 1.27    # PETG
  shell_rib_factor: 1.35     # bosses, ribs, inserts
  fastener_frac: 0.05        # of dry mass
  target_margin: 1.8
  min_margin: 1.4            # below this: no meaningful control authority
fc:
  matek_h743_slim_v3:
    source: https://www.getfpv.com/mateksys-h743-slim-v3-flight-controller.html
    status: verified
    mass_g: 7
    imu: ICM42688P
    baro: DPS310
  other_avionics_g: {value: 70, status: assumption}   # RX, 12V 10A BEC for servo bus, U2D2-class bridge, harness
